<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BERFU BOAT</title>

<!-- Font Ailesi -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
/* Genel Sıfırlama */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
-webkit-tap-highlight-color: transparent; /* Mobil tarayıcılar için tıklama vurgusunu kaldır */
}

/* Sayfa Genel Ayarları (Koyu gri bir arka plan, görselle uyumlu) */
body{
background-color: #1a1a1a; /* Görselin dışındaki koyu alan */
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding: 20px;
overflow:hidden;
}

/* Mobil Ekran Görünümü Veren Ana Konteyner */
.mockup-container{
position:relative;
width: 100%;
max-width: 350px; /* Görseldeki kartın yaklaşık genişliği */
height: 750px; /* Görseldeki kartın yaklaşık yüksekliği */
background: url('image_0.png') center center / contain no-repeat; /* Arka plan görselini (telefon ekranı) buraya koyuyoruz */
display: flex;
justify-content: center;
align-items: flex-start; /* İçeriği yukarıdan hizala */
padding-top: 210px; /* İçeriği telefon ekranının üst kısmına göre aşağı kaydır (Görselden ölçüldü) */
}

/* Şeffaf İçerik Kartı (Görseldeki yarı saydam katman) */
.app-card{
width: 85%; /* Telefon ekranı içindeki genişlik oranı */
background: rgba(255,255,255,.07); /* Çok hafif şeffaf beyaz */
backdrop-filter:blur(25px); /* Bulanıklık efekti */
border:1px solid rgba(255,255,255,.1);
border-radius:35px; /* Görseldeki gibi yuvarlak köşeler */
padding: 40px 20px;
text-align:center;
color:white;
box-shadow:0 10px 40px rgba(0,0,0,.5); /* Belirgin gölge */
}

/* Başlıklar */
h1{
font-size:28px;
font-weight:700;
letter-spacing:1px;
margin-bottom: 2px;
text-transform: uppercase;
}

h2{
font-size:14px;
font-weight:300;
margin-bottom: 35px;
opacity:.8;
letter-spacing: 0.5px;
}

/* Buton Stilleri (Görseldeki gibi renkler ve simgeler) */
.btn{
display:flex;
align-items:center;
justify-content:center;
width:100%;
padding: 14px 20px;
margin: 12px 0;
text-decoration:none;
border-radius:15px; /* Buton köşe yumuşaklığı */
font-size:15px;
font-weight:600;
color:white;
transition: transform 0.1s ease, opacity 0.2s ease;
}

.btn:active{
transform: scale(0.97); /* Tıklama efekti */
opacity: 0.9;
}

background:#4285F4;
}
