.phone-mockup {

  border-radius: 14px;
  font-size: 15px;
  font-weight: 600;
  color: white;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);

.google { background: #4285F4; }
.instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
.whatsapp { background: #25D366; }

.details-text {
  margin-top: 25px;
  font-size: 14px;
  opacity: 0.95;
  letter-spacing: 0.3px;
}

.nfc-icon {
  margin-top: 15px;
  font-size: 18px;
  opacity: 0.7;
  letter-spacing: 3px;
}

.footer-link {
  margin-top: 12px;
  font-size: 11px;
  opacity: 0.6;
  text-decoration: none;
